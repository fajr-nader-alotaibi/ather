<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#132b38">
  <title>ATHAR | أثر — غابة الأمل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="معاينة لعبة أثر">
    <canvas id="world" width="1280" height="720" aria-label="غابة الأمل: لعبة منصات تجريبية"></canvas>
    <header class="hud">
      <section class="story-card">
        <div class="brand-row"><span class="sigil" aria-hidden="true">✦</span><div><h1>ATHAR <span>| أثر</span></h1><p class="chapter" data-ar="غابة الأمل · الفصل الأول" data-en="Hope Forest · Chapter I">غابة الأمل · الفصل الأول</p></div></div>
        <p class="objective" id="objective">اجمع ٣ بذور قمرية وأيقظ الجسر الجذري.</p>
      </section>
      <section class="trail-card" aria-live="polite">
        <span class="trail-label" id="seed-label">بذور القمر</span>
        <strong class="seed-count" id="seed-count">0 <i>/ 3</i></strong>
        <span class="root-thread" aria-hidden="true"><b></b><b></b><b></b></span>
      </section>
      <div class="top-actions">
        <button id="language" class="glass-button language" type="button" aria-label="Change language">عربي / EN</button>
        <button id="pause" class="glass-button pause" type="button" aria-label="إيقاف مؤقت">Ⅱ</button>
      </div>
    </header>
    <div id="hint" class="hint" role="status">A / D أو الأسهم للحركة · Space للقفز · E للتفاعل</div>
    <div class="touch-controls" aria-label="أزرار اللمس">
      <div class="touch-move"><button data-action="move_left" aria-label="يسار">‹</button><button data-action="move_right" aria-label="يمين">›</button></div>
      <div class="touch-use"><button data-action="interact" aria-label="تفاعل">استخدم</button><button data-action="jump" aria-label="قفز">اقفز</button></div>
    </div>
    <div id="veil" class="veil" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-spark" aria-hidden="true">✧</div>
        <h2 id="modal-title"></h2>
        <p id="modal-copy"></p>
        <div class="modal-actions">
          <button id="resume" class="primary" type="button"></button>
          <button id="restart" class="secondary" type="button"></button>
        </div>
      </section>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
